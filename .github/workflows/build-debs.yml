name: Build DSView Debian Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.3.3)'
        required: false
        default: '1.3.3'

env:
  PKG_NAME: dsview
  PKG_VERSION: ${{ github.event.inputs.version || '1.3.3' }}
  PKG_RELEASE: 1
  # Distro the packages are built for. The build runs inside this container
  # image, so this - not the runner label - is what the .deb links against.
  UBUNTU_CODENAME: resolute

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 and arm64 build natively on their own runners. Only riscv64
          # still needs QEMU emulation, which is roughly an order of magnitude
          # slower.
          - arch: amd64
            runner: ubuntu-26.04
            platform: linux/amd64
            qemu: false
          - arch: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
            qemu: false
          - arch: riscv64
            runner: ubuntu-26.04
            platform: linux/riscv64
            qemu: true

    name: Build ${{ matrix.arch }}
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build .deb in container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/output:/output \
            -e PKG_NAME="${{ env.PKG_NAME }}" \
            -e PKG_VERSION="${{ env.PKG_VERSION }}" \
            -e PKG_RELEASE="${{ env.PKG_RELEASE }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:${{ env.UBUNTU_CODENAME }} bash -c '
              set -ex

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake pkg-config git ca-certificates \
                dpkg-dev file \
                libglib2.0-dev zlib1g-dev libusb-1.0-0-dev \
                libboost-dev libboost-filesystem-dev libboost-system-dev libboost-thread-dev \
                libfftw3-dev python3-dev libudev-dev \
                qtbase5-dev libqt5svg5-dev

              ARCH=$(dpkg --print-architecture)
              PKG_ROOT=/tmp/pkg-root

              cd /src
              mkdir -p builddir && cd builddir

              cmake ../ \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_BUILD_TYPE=Release

              make -j$(nproc)

              # Install into staging directory
              make install DESTDIR=${PKG_ROOT}

              # Ensure standard directories exist
              mkdir -p ${PKG_ROOT}/usr/share/applications
              mkdir -p ${PKG_ROOT}/usr/share/pixmaps
              mkdir -p ${PKG_ROOT}/usr/share/DSView

              # Copy .desktop and icon if present in source tree
              if [ -f /src/DSView/DSView.desktop ]; then
                cp /src/DSView/DSView.desktop ${PKG_ROOT}/usr/share/applications/ 2>/dev/null || true
              fi
              if [ -f /src/DSView/icons/logo.svg ]; then
                cp /src/DSView/icons/logo.svg ${PKG_ROOT}/usr/share/pixmaps/dsview.svg 2>/dev/null || true
              fi
              if [ -f /src/DSView/icons/logo.png ]; then
                cp /src/DSView/icons/logo.png ${PKG_ROOT}/usr/share/pixmaps/dsview.png 2>/dev/null || true
              fi

              ##############################################
              # Derive runtime dependencies from the built binaries
              #
              # Do not hardcode the Depends list: library package names and
              # SONAMEs move between Ubuntu releases, and a hand-written list
              # drifts out of sync with what was actually linked. The previous
              # list claimed libfftw3-single3 (DSView links the double-precision
              # libfftw3-double3), named Boost packages that DSView does not
              # link at all (it only uses header-only Boost), and omitted
              # libpython entirely - so the package installed cleanly and then
              # failed at launch on a missing libpython3.12.so.1.0.
              #
              # dpkg-shlibdeps reads the real ELF NEEDED entries and asks dpkg
              # which package owns each one, so the dependencies always match
              # the binary and follow the distro Python automatically.
              ##############################################
              cd ${PKG_ROOT}
              mkdir -p debian
              {
                echo "Source: ${PKG_NAME}"
                echo "Package: ${PKG_NAME}"
                echo "Architecture: ${ARCH}"
              } > debian/control

              ELF_LIST=""
              while IFS= read -r f; do
                if file -b "$f" | grep -qE "ELF.*(executable|shared object)"; then
                  ELF_LIST="${ELF_LIST} $f"
                fi
              done < <(find ${PKG_ROOT}/usr -type f \( -perm -u+x -o -name "*.so*" \))

              if [ -z "${ELF_LIST}" ]; then
                echo "ERROR: no ELF objects found in ${PKG_ROOT}" >&2
                exit 1
              fi

              DEPENDS=$(dpkg-shlibdeps -O --ignore-missing-info -S${PKG_ROOT} ${ELF_LIST} 2>/dev/null | sed -e "s/^shlibs:Depends=//")

              if [ -z "${DEPENDS}" ]; then
                echo "ERROR: dpkg-shlibdeps produced no dependencies" >&2
                exit 1
              fi

              # Runtime-only dependencies that leave no ELF NEEDED entry:
              # libqt5svg5 is dlopened as a Qt imageformats plugin to render the
              # SVG icons, and python3 provides the stdlib that the bundled
              # libsigrokdecode4DSL protocol decoders import.
              DEPENDS="${DEPENDS}, libqt5svg5, python3"

              rm -rf debian
              echo "Generated Depends: ${DEPENDS}"

              # Build .deb with dpkg-deb
              mkdir -p ${PKG_ROOT}/DEBIAN
              INSTALLED_SIZE=$(du -sk ${PKG_ROOT} | cut -f1)

              cat > ${PKG_ROOT}/DEBIAN/control << EOF
          Package: ${PKG_NAME}
          Version: ${PKG_VERSION}-${PKG_RELEASE}
          Architecture: ${ARCH}
          Maintainer: seb@penthertz.com
          Installed-Size: ${INSTALLED_SIZE}
          Depends: ${DEPENDS}
          Provides: dsview
          Section: electronics
          Priority: optional
          Homepage: https://www.dreamsourcelab.com
          Description: DSView - Multi-function instrument GUI
           DSView is an open-source multi-function instrument GUI for
           DreamSourceLab hardware including DSLogic logic analyzers,
           DSCope oscilloscopes, and DSLogic protocol analyzers.
          EOF

              # Post-install: ldconfig + udev reload
              cat > ${PKG_ROOT}/DEBIAN/postinst << "POSTINST"
          #!/bin/bash
          set -e
          ldconfig
          if command -v udevadm > /dev/null 2>&1; then
            udevadm control --reload-rules 2>/dev/null || true
            udevadm trigger 2>/dev/null || true
          fi
          POSTINST
              chmod 755 ${PKG_ROOT}/DEBIAN/postinst

              # Post-remove: run ldconfig
              cat > ${PKG_ROOT}/DEBIAN/postrm << "POSTRM"
          #!/bin/bash
          set -e
          ldconfig
          POSTRM
              chmod 755 ${PKG_ROOT}/DEBIAN/postrm

              DEB_FILE="/output/${PKG_NAME}_${PKG_VERSION}-${PKG_RELEASE}_${ARCH}.deb"
              dpkg-deb --build ${PKG_ROOT} ${DEB_FILE}

              echo "=== Built package ==="
              ls -lh ${DEB_FILE}
              dpkg-deb --info ${DEB_FILE}
              echo "=== Package contents (first 50 lines) ==="
              dpkg-deb --contents ${DEB_FILE} | head -50
            '

      # Run the smoke test on every natively-built architecture. It is skipped
      # only for the QEMU-emulated riscv64 build, where launching a Qt GUI under
      # emulation is slow and prone to spurious failures.
      - name: Verify .deb installs and runs
        if: ${{ !matrix.qemu }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/output:/output \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:${{ env.UBUNTU_CODENAME }} bash -c '
              set -ex
              apt-get update

              # Install the package the way a user would. apt has to resolve the
              # generated Depends, so a wrong or missing dependency fails here
              # rather than on the user machine.
              apt-get install -y --no-install-recommends /output/*.deb

              # A half-configured package means a dependency problem.
              dpkg-query -W -f="\${Status}\n" dsview
              dpkg-query -W -f="\${Status}" dsview | grep -q "install ok installed"

              # Fail on any unresolved SONAME. This is the check that would have
              # caught the missing libpython3.12.so.1.0 at build time: the old
              # package installed cleanly and only broke when launched.
              echo "--- ldd /usr/bin/DSView ---"
              ldd /usr/bin/DSView
              if ldd /usr/bin/DSView | grep "not found"; then
                echo "ERROR: unresolved libraries in /usr/bin/DSView" >&2
                exit 1
              fi

              # Actually launch it under the offscreen Qt platform plugin. It has
              # no reason to exit on its own, so the expected result is the
              # timeout killing it (exit 124).
              rc=0
              QT_QPA_PLATFORM=offscreen timeout 25 DSView > /tmp/dsview.log 2>&1 || rc=$?
              cat /tmp/dsview.log
              if [ "${rc}" != "124" ] && [ "${rc}" != "0" ]; then
                echo "ERROR: DSView exited with ${rc}" >&2
                exit 1
              fi

              # It must find its installed data directory, otherwise it aborts
              # on startup with an assertion.
              grep -q "GetAppDataDir" /tmp/dsview.log
              echo "=== smoke test passed ==="
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}_${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}_${{ matrix.arch }}
          path: output/*.deb
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: debs
          merge-multiple: true

      - name: List packages
        run: |
          echo "=== Built packages ==="
          ls -lh debs/
          for f in debs/*.deb; do
            echo "--- $(basename $f) ---"
            dpkg-deb --info "$f" | grep -E '(Package|Version|Architecture|Installed-Size|Depends)'
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: debs/*.deb
          generate_release_notes: true
          body: |
            ## DSView ${{ env.PKG_VERSION }}

            Pre-built Debian packages for Ubuntu Resolute Raccoon (26.04).

            Built against the Ubuntu 26.04 library stack (Qt 5.15.18, Python 3.14).
            These packages will not install on Ubuntu 24.04 (noble), which ships
            Python 3.12.

            ### Install
            ```bash
            wget <url-to-deb>
            sudo apt install ./dsview_*.deb
            ```

            ### Architectures
            - `amd64` - x86_64
            - `arm64` - AArch64
            - `riscv64` - RISC-V 64

      - name: Upload debs for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: all-debs-${{ env.PKG_VERSION }}
          path: debs/*.deb
          retention-days: 90
